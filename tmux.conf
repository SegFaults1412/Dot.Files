# ~/.tmux.conf

# Prefix: Ctrl+Space
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g mode-keys emacs
set -g base-index 0
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# --- Windows ---
bind n new-window -c "#{pane_current_path}"
bind Right next-window
bind Left  previous-window
bind L choose-tree -w
bind w kill-window

# --- Panes ---
bind d split-window -v -c "#{pane_current_path}"   # top/bottom
bind r split-window -h -c "#{pane_current_path}"   # side by side
bind p kill-pane
bind S-Left  swap-pane -U
bind S-Right swap-pane -D

# Alt+arrows: move between panes (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Copy mode ---
bind c copy-mode
bind -T copy-mode Space send -X begin-selection
bind -T copy-mode Enter send -X copy-selection-and-cancel
bind v paste-buffer

# --- Session ---
bind q detach-client
bind f source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# --- Theme: HTB green on #0d1117 ---
set -g status-style "bg=#0d1117,fg=#9fef00"
set -g window-status-current-style "bg=#9fef00,fg=#0d1117,bold"
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#9fef00"
set -g message-style "bg=#0d1117,fg=#9fef00"
set -g mode-style "bg=#9fef00,fg=#0d1117"
